# CI: lo desplegable de verdad, en cada push y PR a main. El job `check`
# corre `pnpm check` entero (contrato, versiones, UI, py, pytest y rust) en
# Ubuntu; el job `windows` repite ahí `check:py` y `check:ui`, que es donde se
# notan las diferencias de plataforma; el job `linux` empaqueta el desktop
# (deb y AppImage) para que el release no etiquete a ciegas.
#
# Fuera a propósito: la batería e2e (necesita el navegador de Playwright y
# puertos libres; se corre en local con `pnpm e2e`). Los instaladores de
# Windows siguen saliendo solo en el release; el de Linux se comprueba aquí.
#
# Tauri en Linux necesita sus deps de sistema para `cargo check`; sin ellas
# el check de Rust no compila (docs de Tauri: deps para Ubuntu).

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Tauri deps (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-python@v7
        with:
          python-version: 3.12

      - name: uv
        uses: astral-sh/setup-uv@v7

      - name: Rust (estable)
        uses: dtolnay/rust-toolchain@stable

      - name: pnpm install
        run: corepack pnpm install --frozen-lockfile

      # `cargo check` no ejecuta el sidecar, pero el build script de Tauri
      # exige que exista `binaries/events-core-<triple>` (declarado en
      # tauri.conf.json). Se crea el placeholder y listo.
      - name: Placeholder del sidecar para Tauri
        run: |
          mkdir -p apps/desktop/src-tauri/binaries
          touch apps/desktop/src-tauri/binaries/events-core-x86_64-unknown-linux-gnu
          touch apps/desktop/src-tauri/binaries/eui-x86_64-unknown-linux-gnu

      - name: check completo
        run: corepack pnpm check

      # La guarda del flujo: documentos fuera del flujo y puertas activas. Es la
      # misma salida que deja el pre-commit en local, y sale con 1 si hay algo.
      - name: Guarda del flujo
        run: >-
          uv run --directory services/core python -m events_core.cli guard
          --repo "$GITHUB_WORKSPACE"

  windows:
    # El desarrollo es Windows: aquí lo que depende de la plataforma y Ubuntu
    # no cubre (rutas con unidad, `#` en el nombre del repo, venv de otra
    # plataforma). Sin deps de Tauri ni placeholder del sidecar: no hay Rust.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-python@v7
        with:
          python-version: 3.12

      - name: uv
        uses: astral-sh/setup-uv@v7

      - name: pnpm install
        run: corepack pnpm install --frozen-lockfile

      - name: check:py
        run: corepack pnpm check:py

      - name: check:ui
        run: corepack pnpm check:ui

  # El empaquetado de Linux se verifica aquí, no solo en el release: si el deb
  # o el AppImage dejan de salir, o pierden los binarios del sidecar, se ve en
  # el push y no al etiquetar. Misma base que el release (`ubuntu-22.04`) para
  # que lo verificado sea lo que se publica.
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Tauri deps (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-python@v7
        with:
          python-version: 3.12

      - name: uv
        uses: astral-sh/setup-uv@v7

      - name: Rust (estable)
        uses: dtolnay/rust-toolchain@stable

      - name: pnpm install
        run: corepack pnpm install --frozen-lockfile

      - name: Sidecar (PyInstaller)
        run: corepack pnpm build:sidecar

      - name: Bundles (deb y AppImage)
        run: corepack pnpm --filter desktop exec tauri build --bundles deb,appimage

      # La ficha exige que el core y el CLI viajen dentro del paquete, no como
      # adjunto aparte: se mira el contenido del deb, no solo que exista.
      - name: Los binarios van dentro del deb
        shell: bash
        run: |
          set -euo pipefail
          deb=$(ls apps/desktop/src-tauri/target/release/bundle/deb/*.deb | head -1)
          appimage=$(ls apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage | head -1)
          dpkg -c "$deb" | grep -E '/(events-core|eui)$'
          ls -l "$deb" "$appimage"
