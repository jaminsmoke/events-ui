# Release: al empujar un tag `vX.Y.Z`, construye el sidecar y los dos
# instaladores en Windows y los adjunta a la GitHub Release del tag.
#
# El flujo local (`corepack pnpm release`) sigue siendo el que sube la versión,
# commitea y etiqueta; este workflow solo empaqueta y publica. Así el tag no
# se crea aquí y no hay dos fuentes de verdad para la versión.
#
# `workflow_dispatch` existe para reconstruir un tag antiguo (por ejemplo, si
# un build falló): con `publicar: false` solo construye y deja los instaladores
# como artefactos del run, sin tocar la release publicada.
#
# Si la release del tag ya existe, los instaladores se suben con `--clobber`
# en vez de crear otra; si no existe, se crea con las notas generadas por
# GitHub a partir de los commits desde el tag anterior.
#
# El updater de la app necesita dos cosas más en cada release: los `.sig` de
# los instaladores (los genera Tauri con `createUpdaterArtifacts`) y un
# `latest.json` con la firma del NSIS y su URL. Ambos se publican aquí; sin
# ellos la app no puede aceptar ni encontrar una versión nueva.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a empaquetar (p. ej. v0.2.2)"
        required: true
        type: string
      publicar:
        description: "Adjuntar los instaladores a la GitHub Release del tag"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      # El tag y la versión del repo tienen que decir lo mismo: si no, los
      # instaladores saldrían con un nombre que no es el del tag.
      - name: Comprobar el tag contra la versión
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          echo "tag=$TAG versión=$version"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::El tag $TAG no coincide con la versión $version del repo."
            exit 1
          fi

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-python@v7
        with:
          python-version: 3.12

      - name: uv
        uses: astral-sh/setup-uv@v7

      - name: Rust (estable)
        uses: dtolnay/rust-toolchain@stable

      - name: pnpm install
        run: corepack pnpm install --frozen-lockfile

      # `tauri build` falla si no existe el `externalBin`, así que el sidecar
      # va antes. El script lo arranca en frío y comprueba `/health`.
      - name: Sidecar (PyInstaller)
        run: corepack pnpm build:sidecar

      # La clave privada vive en secrets. Sin ella Tauri no firma; el paso
      # falla con un error claro en vez de publicar un updater inservible.
      # `--config` deja `createUpdaterArtifacts` solo en el release: un
      # `pnpm build` local no necesita la clave para construir la app.
      - name: Bundles (MSI y NSIS) firmados
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Falta el secret TAURI_SIGNING_PRIVATE_KEY: sin firma no hay updater."
            exit 1
          fi
          corepack pnpm --filter desktop exec tauri build \
            --config '{"bundle":{"createUpdaterArtifacts":true}}'

      - name: Instaladores y firmas
        id: instaladores
        shell: bash
        run: |
          msi=$(ls apps/desktop/src-tauri/target/release/bundle/msi/*.msi | head -1)
          exe=$(ls apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
          exe_sig="$exe.sig"
          if [ ! -f "$exe_sig" ]; then
            echo "::error::El build no generó $exe_sig: revisa la clave de firma."
            exit 1
          fi
          echo "msi=$msi" >> "$GITHUB_OUTPUT"
          echo "exe=$exe" >> "$GITHUB_OUTPUT"
          echo "exe_sig=$exe_sig" >> "$GITHUB_OUTPUT"
          ls -l "$msi" "$exe" "$exe_sig"

      # `inputs` solo existe en `workflow_dispatch`: en un push de tag queda
      # vacío y GitHub lo compara como `false`, así que las condiciones miran
      # primero el evento. Si no, el tag construía y no publicaba nada.
      - name: Artefactos del run (sin publicar)
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publicar }}
        uses: actions/upload-artifact@v7
        with:
          name: instaladores-${{ env.TAG }}
          path: |
            ${{ steps.instaladores.outputs.msi }}
            ${{ steps.instaladores.outputs.exe }}
            ${{ steps.instaladores.outputs.exe_sig }}
          if-no-files-found: error

      - name: Publicar instaladores en GitHub Releases
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publicar }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          msi="${{ steps.instaladores.outputs.msi }}"
          exe="${{ steps.instaladores.outputs.exe }}"
          exe_sig="${{ steps.instaladores.outputs.exe_sig }}"
          # El MSI no se usa para actualizar (el updater va por NSIS), pero si
          # Tauri también lo firmó se adjunta: no estorba y sirve al que baje
          # el MSI a mano.
          adjuntos=("$msi" "$exe" "$exe_sig")
          if [ -f "$msi.sig" ]; then adjuntos+=("$msi.sig"); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "La release $TAG ya existe: se reemplazan los instaladores."
            gh release upload "$TAG" "${adjuntos[@]}" --clobber
          else
            gh release create "$TAG" "${adjuntos[@]}" \
              --verify-tag --title "Events UI $TAG" --generate-notes
          fi

      # El manifiesto se genera después de publicar para llevar las notas que
      # GitHub haya generado. La URL usa /releases/download/, no /latest/:
      # la app ya consulta /releases/latest/download/latest.json y este
      # fichero tiene que apuntar a SU tag, no al que sea último mañana.
      - name: Manifiesto del updater (latest.json)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publicar }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes=$(gh release view "$TAG" --json body -q .body)
          # GitHub cambia los espacios del nombre del activo por puntos. El
          # manifiesto tiene que apuntar al nombre publicado, no al local, o
          # la URL del updater da 404.
          exe_asset=$(gh release view "$TAG" --json assets \
            -q '.assets[] | select(.name | endswith("-setup.exe")) | .name' | head -1)
          node scripts/latest-json.mjs \
            --version "${TAG#v}" \
            --tag "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --artifact "$exe_asset" \
            --signature "${{ steps.instaladores.outputs.exe_sig }}" \
            --notes "$notes" \
            --output latest.json
          gh release upload "$TAG" latest.json --clobber

  # El paquete de npm va en su propio job: no depende de Windows ni de Tauri,
  # así que un fallo de firma no impide publicar el esquema. Sin token guardado:
  # npm valida el OIDC del runner contra el trusted publisher del paquete (repo
  # `jaminsmoke/events-ui` y este workflow, `release.yml`). El primer publish
  # fue manual porque el publisher solo se puede registrar sobre un paquete que
  # ya existe.
  npm:
    # Solo en el push del tag. Un `workflow_dispatch` reconstruye una release ya
    # publicada, y esa versión ya está en el registro: `npm publish` fallaría.
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # Node 24 trae npm 11, pero el OIDC con trusted publishing necesita
      # 11.5.1+: se actualiza en vez de confiar en el que venga en la imagen.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: npm con trusted publishing
        run: npm install -g npm@latest

      - name: Comprobar el tag contra la versión del paquete
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./packages/protocols/package.json').version")
          echo "tag=$TAG versión=$version"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::El tag $TAG no coincide con la versión $version de events-ui-protocols."
            exit 1
          fi

      # `publishConfig.access` del paquete ya dice `public`: el scope no es de
      # pago y sin eso npm lo tomaría como restringido.
      # Un re-run del tag no puede republicar: npm rechaza una versión que ya
      # está en el registro. Si ya está, se salta el publish y el job queda verde.
      - name: ¿Ya está publicada la versión?
        id: publicado
        shell: bash
        run: |
          version=$(node -p "require('./packages/protocols/package.json').version")
          if npm view "events-ui-protocols@$version" version >/dev/null 2>&1; then
            echo "saltar=true" >> "$GITHUB_OUTPUT"
            echo "::notice::events-ui-protocols@$version ya está en el registro: no se republica."
          fi

      - name: Publicar events-ui-protocols
        if: ${{ steps.publicado.outputs.saltar != 'true' }}
        working-directory: packages/protocols
        run: npm publish

  # El paquete web va en su propio job, aparte del de protocols: publica otra
  # cosa y comprueba otra versión. Igual que aquel, sin token guardado: npm
  # valida el OIDC del runner contra el trusted publisher del paquete (repo
  # `jaminsmoke/events-ui`, este workflow). El primer publish es manual, porque
  # el trusted publisher solo se registra sobre un paquete que ya existe.
  #
  # Va en Windows porque el paquete lleva dentro sus binarios
  # (`apps/web/native/<os>-<arch>/`) y hoy solo se compilan para Windows x64:
  # publicado desde Linux, el tarball saldría sin `eui` y sin core.
  npm-webapp:
    if: ${{ github.event_name == 'push' }}
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - uses: actions/setup-python@v7
        with:
          python-version: 3.12

      - name: uv
        uses: astral-sh/setup-uv@v7

      - name: Rust (estable)
        uses: dtolnay/rust-toolchain@stable

      - name: npm con trusted publishing
        run: npm install -g npm@latest

      - name: Comprobar el tag contra la versión del paquete
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./apps/web/package.json').version")
          echo "tag=$TAG versión=$version"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::El tag $TAG no coincide con la versión $version de events-ui-webapp."
            exit 1
          fi

      - name: pnpm install
        run: corepack pnpm install --frozen-lockfile

      # Los binarios no se commitean: `build:sidecar` los compila y los deja en
      # `apps/web/native/<os>-<arch>/`, que es lo que empaqueta `files`.
      - name: Sidecar (PyInstaller)
        run: corepack pnpm build:sidecar

      - name: Comprobar que los binarios viajan en el paquete
        shell: bash
        run: |
          for f in eui.exe events-core.exe; do
            if [ ! -f "apps/web/native/win32-x64/$f" ]; then
              echo "::error::Falta apps/web/native/win32-x64/$f: el paquete saldría sin binarios."
              exit 1
            fi
          done

      # `publishConfig.access` del paquete ya dice `public`; `prepack` compila
      # `dist`, y las devDependencies (con `workspace:*`) las resuelve pnpm.
      # Un re-run del tag no puede republicar: npm rechaza una versión que ya
      # está en el registro. Si ya está, se salta el publish y el job queda verde.
      - name: ¿Ya está publicada la versión?
        id: publicado
        shell: bash
        run: |
          version=$(node -p "require('./apps/web/package.json').version")
          if npm view "@jaminsmoke/events-ui-webapp@$version" version >/dev/null 2>&1; then
            echo "saltar=true" >> "$GITHUB_OUTPUT"
            echo "::notice::@jaminsmoke/events-ui-webapp@$version ya está en el registro: no se republica."
          fi

      - name: Publicar @jaminsmoke/events-ui-webapp
        if: ${{ steps.publicado.outputs.saltar != 'true' }}
        working-directory: apps/web
        run: npm publish
