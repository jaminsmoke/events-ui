[project]
name = "events-core"
version = "0.0.0"
description = "Capa de lectura sobre el log de eventos SQLite."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pyinstaller>=6",
    "pytest>=8.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/events_core"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# El mínimo que pilla errores de verdad sin pelearse con el estilo: pyflakes,
# imports desordenados, sintaxis moderna y trampas comunes (B, SIM).
select = ["E", "F", "I", "UP", "B", "SIM"]
